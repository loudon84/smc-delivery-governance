  current_roadmap_tests: 3
  failure_policy: fail-closed
  installer_transactional_rollback: true
  consumer_validator_is_separate_gate: true

known_transition:
  current_installer_profile: nodeskclaw-compatible
  target_next_minor:
    bundle_version: 4.2.0
    objective: externalize consumer-specific assumptions into versioned consumer profiles
