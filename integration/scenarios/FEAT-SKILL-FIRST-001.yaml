scenario_id: INT-SKILL-FIRST-001
feature_id: FEAT-SKILL-FIRST-001
title: Skill First Catalog → Run → Event → Result → Artifact
state: WAITING_CONSUMER

requires:
  contracts:
    - contract_id: SKILL-RUN-CONTRACT
      required_version: 1.2.1
      minimum_state: CONSUMED
  work_packages:
    - work_package_id: WP-SKILL-FIRST-NODESKCLAW
      minimum_state: VERIFIED
    - work_package_id: WP-SKILL-FIRST-SMC-COPILOT
      minimum_state: VERIFIED

runner:
  command: python integration/runners/skill_first_http.py
  timeout_seconds: 300

environment:
  id: integration
  endpoint_ref: secret://SMC_SKILL_RUN_BASE_URL

steps:
  - id: S01
    actor: consumer
    action: tools/list
    expect: configured safe Published Skill is returned

  - id: S02
    actor: consumer
    action: tools/call
    expect: exactly one Provider run_id is accepted

  - id: S03
    actor: provider
    action: event stream
    expect: authenticated SSE endpoint is reachable

  - id: S04
    actor: consumer
    action: materialize result
    expect: terminal result is recoverable

  - id: S05
    actor: consumer
    action: discover artifacts
    expect: artifact endpoint is reachable

negative_cases:
  - unauthorized
  - unpublished_skill
  - duplicate_submission
  - sse_reconnect
  - cancel
  - artifact_discovery_failure

evidence_required:
  - provider_conformance
  - consumer_conformance
  - cross_end_run_identity
  - immutable_integration_run
