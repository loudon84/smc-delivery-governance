name: Governance Sync Dispatch
on:
  repository_dispatch:
    types: [smc-governance-sync]

concurrency:
  group: governance-reconcile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SMC_GOVERNANCE_GITHUB_TOKEN: ${{ secrets.SMC_GOVERNANCE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Sync affected repository
        shell: bash
        run: |
          set -e
          REPO_ID='${{ github.event.client_payload.repository_id }}'
          python tools/run_scheduled_sync.py --apply --repository-id "$REPO_ID"
          code=$?
          if [ "$code" -eq 1 ]; then exit 1; fi
      - name: Commit observed state
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "smc-governance-bot"
          git config user.email "smc-governance-bot@users.noreply.github.com"
          git add features registry audit integration
          git commit -m "chore(governance): event-driven sync for ${{ github.event.client_payload.repository_id }}"
          git push
