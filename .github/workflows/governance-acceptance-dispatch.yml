name: Governance Acceptance Dispatch
on:
  repository_dispatch:
    types: [smc-governance-acceptance]

concurrency:
  group: governance-reconcile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SMC_GOVERNANCE_GITHUB_TOKEN: ${{ secrets.SMC_GOVERNANCE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify acceptance artifact and attestation
        run: |
          python tools/sync_acceptance_attestation.py \
            --repository-id '${{ github.event.client_payload.repository_id }}' \
            --run-id '${{ github.event.client_payload.run_id }}' \
            --artifact-name '${{ github.event.client_payload.artifact_name }}' \
            --apply
      - name: Reconcile affected repository
        shell: bash
        run: |
          set +e
          python tools/run_scheduled_sync.py \
            --apply \
            --repository-id '${{ github.event.client_payload.repository_id }}'
          code=$?
          set -e
          case "$code" in
            0|2) ;;
            *) exit "$code" ;;
          esac
      - name: Commit trusted acceptance and state
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "smc-governance-bot"
          git config user.email "smc-governance-bot@users.noreply.github.com"
          git add features registry audit integration
          git commit -m "chore(governance): verify acceptance ${{ github.event.client_payload.repository_id }}"
          git push
