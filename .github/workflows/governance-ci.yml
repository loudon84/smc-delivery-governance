name: Governance CI
on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SMC_GOVERNANCE_GITHUB_TOKEN: ${{ secrets.SMC_GOVERNANCE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python tools/validate_registry.py
      - name: Validate all features
        shell: bash
        run: |
          for d in features/FEAT-*; do
            [ -d "$d" ] || continue
            python tools/validate_feature.py "$d"
          done
      - run: python tools/verify_state_invariants.py
      - run: pytest -q
      - name: Tests must not mutate central SOT
        run: git diff --exit-code
