name: Governance CI
on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python tools/validate_registry.py
      - name: Validate all features
        shell: bash
        run: |
          for d in features/FEAT-*; do
            [ -d "$d" ] || continue
            python tools/validate_feature.py "$d"
          done
      - run: pytest -q
