name: Sync Project Status
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SMC_GOVERNANCE_GITHUB_TOKEN: ${{ secrets.SMC_GOVERNANCE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Sync project bootstrap reports
        run: python tools/sync_project_registry.py --apply
      - name: Pull repository receipts and GitHub work links
        shell: bash
        run: |
          set +e
          for d in features/FEAT-*; do
            [ -d "$d" ] || continue
            python tools/sync_repo_state.py "$d" --apply --discover-github
          done
          exit 0
      - name: Reconcile central lifecycle states from synchronized evidence
        shell: bash
        run: |
          for d in features/FEAT-*; do
            [ -d "$d" ] || continue
            python tools/reconcile_states.py "$d" --apply || true
          done
      - run: python tools/reconcile_project_status.py
      - run: python tools/validate_registry.py
      - name: Validate all features after sync
        shell: bash
        run: |
          for d in features/FEAT-*; do
            [ -d "$d" ] || continue
            python tools/validate_feature.py "$d"
          done
      - name: Commit observed state
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "smc-governance-bot"
          git config user.email "smc-governance-bot@users.noreply.github.com"
          git add features registry
          git commit -m "chore(governance): sync repository delivery state"
          git push
