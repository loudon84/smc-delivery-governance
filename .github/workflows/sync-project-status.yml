name: Sync Project Status
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: governance-reconcile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SMC_GOVERNANCE_GITHUB_TOKEN: ${{ secrets.SMC_GOVERNANCE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Sync and reconcile governance state
        id: sync
        shell: bash
        run: |
          set +e
          python tools/run_scheduled_sync.py --apply
          code=$?
          set -e
          case "$code" in
            0)
              echo "expected_non_ready=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "expected_non_ready=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "system_error=true" >> "$GITHUB_OUTPUT"
              exit "$code"
              ;;
          esac
      - name: Commit observed state
        if: success()
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "smc-governance-bot"
          git config user.email "smc-governance-bot@users.noreply.github.com"
          git add features registry audit integration
          git commit -m "chore(governance): reconcile repository delivery state"
          git push
