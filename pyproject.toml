[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-delivery-governance"
version = "1.2.1"
description = "SMC cross-repository engineering delivery control plane"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5"
]

[project.scripts]
ges = "ges.cli.main:main"

[tool.setuptools.packages.find]
include = ["ges*"]

[tool.setuptools.package-data]
ges = ["schemas/*.json", "catalog/*.yaml", "catalog/profiles/*.yaml", "legacy/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
