contract:
  states: [DRAFT, CANDIDATE, APPROVED, RELEASED, CONSUMED, CONFORMANCE_PASS, DEPRECATED, RETIRED]
  transitions:
    DRAFT: [CANDIDATE]
    CANDIDATE: [DRAFT, APPROVED]
    APPROVED: [CANDIDATE, RELEASED]
    RELEASED: [CONSUMED, DEPRECATED]
    CONSUMED: [CONFORMANCE_PASS, DEPRECATED]
    CONFORMANCE_PASS: [DEPRECATED]
    DEPRECATED: [RETIRED]
    RETIRED: []
feature:
  states: [PROPOSED, ARCHITECTURE, PLANNED, IMPLEMENTING, INTEGRATING, VERIFYING, DONE, BLOCKED, CANCELLED]
  transitions:
    PROPOSED: [ARCHITECTURE, CANCELLED]
    ARCHITECTURE: [PLANNED, BLOCKED, CANCELLED]
    PLANNED: [IMPLEMENTING, BLOCKED, CANCELLED]
    IMPLEMENTING: [INTEGRATING, BLOCKED, CANCELLED]
    INTEGRATING: [VERIFYING, BLOCKED]
    VERIFYING: [DONE, BLOCKED]
    BLOCKED: [ARCHITECTURE, PLANNED, IMPLEMENTING, INTEGRATING, VERIFYING, CANCELLED]
    DONE: []
    CANCELLED: []
work_package:
  states: [BACKLOG, READY, IN_PRD, PLANNED, IMPLEMENTING, REVIEW, VERIFIED, DONE, BLOCKED, SUPERSEDED]
  transitions:
    BACKLOG: [READY, BLOCKED, SUPERSEDED]
    READY: [IN_PRD, BLOCKED, SUPERSEDED]
    IN_PRD: [PLANNED, BLOCKED, SUPERSEDED]
    PLANNED: [IMPLEMENTING, BLOCKED, SUPERSEDED]
    IMPLEMENTING: [REVIEW, BLOCKED, SUPERSEDED]
    REVIEW: [IMPLEMENTING, VERIFIED, BLOCKED]
    VERIFIED: [DONE, BLOCKED]
    BLOCKED: [READY, IN_PRD, PLANNED, IMPLEMENTING, REVIEW, VERIFIED, SUPERSEDED]
    DONE: []
    SUPERSEDED: []
integration:
  states: [WAITING_PROVIDER, WAITING_CONSUMER, READY, RUNNING, PASS, FAIL, BLOCKED]
  transitions:
    WAITING_PROVIDER: [WAITING_CONSUMER, READY, BLOCKED]
    WAITING_CONSUMER: [READY, BLOCKED]
    READY: [RUNNING, BLOCKED]
    RUNNING: [PASS, FAIL, BLOCKED]
    FAIL: [READY, RUNNING, BLOCKED]
    BLOCKED: [WAITING_PROVIDER, WAITING_CONSUMER, READY]
    PASS: []
roadmap_item:
  states: [PLANNED, ACTIVE, DONE, BLOCKED, CANCELLED]
  transitions:
    PLANNED: [ACTIVE, BLOCKED, CANCELLED]
    ACTIVE: [DONE, BLOCKED, CANCELLED]
    BLOCKED: [ACTIVE, CANCELLED]
    DONE: []
    CANCELLED: []
